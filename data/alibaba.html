            <style>
.become-supplier-content {
  display: flex;
  justify-content: center;
  gap: 40px;
}

.become-supplier-content a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 280px;
  height: 144px;
  padding: 0 20px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.become-supplier-content a .tnh-icon {
  margin-bottom: 14px;
  font-size: 40px;
  line-height: 40px;
}

.become-supplier-content a .become-supplier-content-desc {
  height: 44px;
  text-align: center;
}

.help-center-content {
  display: flex;
  width: 100%;
  min-height: 116px;
  color: #222;
  align-items: stretch;
}

.help-center-content__links {
  display: grid;
  flex: 1 1 auto;
  min-width: 0;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-gap: 12px 40px;
  gap: 12px 40px;
}

.help-center-content__link {
  display: flex;
  width: 100%;
  min-width: 0;
  height: 52px;
  padding: 0 16px;
  border-radius: 8px;
  background: #f8f8f8;
  color: #222;
  -webkit-text-decoration: none;
  text-decoration: none;
  align-items: center;
  gap: 12px;
}

.help-center-content__link:hover {
  color: #222;
  -webkit-text-decoration: none;
  text-decoration: none;
}

.help-center-content__link:hover .help-center-content__link-text {
  -webkit-text-decoration: underline;
  text-decoration: underline;
}

.help-center-content__link .tnh-icon {
  flex: 0 0 auto;
  font-size: 20px;
  line-height: 20px;
}

.help-center-content__link-text {
  display: -webkit-box;
  overflow: hidden;
  font-size: 14px;
  font-weight: 600;
  line-height: 18px;
  text-overflow: ellipsis;
  word-break: break-word;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  flex: 1 1 auto;
}

.tnh-languages {
  position: relative;
  display: flex;
}

.tnh-languages .current {
  display: flex;
  align-items: center;
}

.tnh-languages .current > div {
  margin-right: 4px;
}

html[dir="rtl"] .tnh-languages .current > div {
  margin-right: 0;
  margin-left: 4px;
}

.tnh-languages .current .tnh-icon {
  font-size: 24px;
}

.tnh-languages .current .tnh-icon:last-child {
  margin-right: 0;
}

html[dir="rtl"] .tnh-languages .current .tnh-icon:last-child {
  margin-right: 0;
  margin-left: 0;
